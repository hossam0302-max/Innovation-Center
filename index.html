    const HOME_SERVICES_PREVIEW_LIMIT = 3;
    const HOME_SERVICES_PREVIEW_THRESHOLD = 3;

    const SERVICE_EXAMPLES_PREVIEW_LIMIT = 2;

    /**
     * يبني قائمة «أمثلة تقنية» داخل الكارت.
     * يعرض أول نقطتين فقط؛ إن وُجدت عناصر إضافية يظهر رابط «المزيد ...».
     * @param {{examples?: (string|{title: string, items: string[]})[], examplesTitle?: string}} service
     * @returns {string} HTML للقائمة، أو نص فارغ إن لم توجد أمثلة.
     */
    function renderServiceExamples(service) {
      const examples = service.examples || [];
      if (!examples.length) return "";

      const items = examples.map((example, index) => {
        const extraClass = index >= SERVICE_EXAMPLES_PREVIEW_LIMIT ? " is-example-extra" : "";
        if (typeof example === "string") {
          return `<li class="${extraClass.trim()}">${escapeHtml(example)}</li>`;
        }
        const children = (example.items || []).map((item) => `<li>${escapeHtml(item)}</li>`).join("");
        return `<li class="${extraClass.trim()}"><strong>${escapeHtml(example.title || "")}</strong><ul>${children}</ul></li>`;
      }).join("");

      const moreHtml = examples.length > SERVICE_EXAMPLES_PREVIEW_LIMIT
        ? `<button type="button" class="service-examples-more" onclick="expandServiceExamples(this)">المزيد ...</button>`
        : "";

      return `
        <div class="service-examples">
          <div class="service-examples-title"><i class="bi bi-list-check"></i> ${escapeHtml(service.examplesTitle || "أمثلة تقنية")}</div>
          <ul>${items}</ul>
          ${moreHtml}
        </div>
      `;
    }

    /** يوسّع قائمة أمثلة التقنية داخل الكارت لإظهار النقاط المخفية. */
    function expandServiceExamples(button) {
      const box = button?.closest(".service-examples");
      if (!box) return;
      box.classList.add("is-expanded");
    }

    function renderServiceCards() {
      const term = searchTerm.trim().toLowerCase();
      const filtered = services.filter((s) => {
        if (categoryFilter && s.sector !== categoryFilter) return false;
        for (const f of filterRegistry) {
          if (!f.match(s, f.getValue())) return false;
        }
        if (!term) return true;
        const haystack = `${s.title} ${s.description} ${s.sector} ${s.keywords} ${(s.beneficiaries || []).join(" ")}`.toLowerCase();
        return haystack.includes(term);
      });

      if (filtered.length === 0) {
        return `
          <div class="col-12">
            <div class="empty-state" role="status">
              <i class="bi bi-funnel"></i>
              <div class="fw-semibold" style="color: var(--naama-primary)">لا توجد خدمات مطابقة للمعايير المحددة.</div>
              <div class="mt-1">جرّب مصطلحًا آخر أو أعد ضبط الفلاتر.</div>
              <button type="button" class="filters-reset mt-3" onclick="resetFilters()">
                <i class="bi bi-arrow-counterclockwise"></i> إعادة تعيين الفلاتر
              </button>
            </div>
          </div>
        `;
      }

      /*
        لكل التصنيفات (بما فيها البيئة / المياه / الزراعة):
        إذا تجاوز عدد الخدمات المطابقة 3، نعرض أول 3 فقط مع رابط "المزيد".
      */
      const shouldLimit = !homeServicesShowAll && filtered.length > HOME_SERVICES_PREVIEW_THRESHOLD;
      const toRender = shouldLimit ? filtered.slice(0, HOME_SERVICES_PREVIEW_LIMIT) : filtered;

      const cardsHtml = toRender.map((s) => {
        const acc = sectorAccents[s.sector] || sectorAccents["استراتيجيات الابتكار"];
        const styleVars = `--card-accent:${acc.c1}; --card-accent-dark:${acc.c2};`;
        const fallbackHandler = "this.parentElement.classList.add('no-img'); this.remove();";
        const deadlineInfo = formatServiceDeadline(s.deadline);
        /* صور المجالات مقتطعة من شرائح عريضة، فتُعرض كاملة (contain) بدل قصّها */
        const imageFitClass = s.domainCard ? "is-contain" : "";
        const serviceUrl = s.referenceUrl || s.externalUrl || "";
        const titleHtml = serviceUrl
          ? `<a class="service-title-link" href="${escapeHtml(serviceUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(s.title)}</a>`
          : escapeHtml(s.title);
        return `
        <div class="col-lg-4 col-md-6">
          <div class="service-card-shell" style="${styleVars}">
            <svg class="service-card-ring" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <rect class="ring-base" x="1" y="1" width="98" height="98" rx="8" ry="8" pathLength="300"></rect>
              <rect class="ring-beam" x="1" y="1" width="98" height="98" rx="8" ry="8" pathLength="300"></rect>
            </svg>
            <article class="service-card">
              <div class="service-image ${imageFitClass}${s.image ? "" : " no-img"}" style="${styleVars}">
                ${s.image ? `<img src="${escapeHtml(s.image)}?v=8" alt="${escapeHtml(s.title)}" loading="lazy" referrerpolicy="no-referrer" onerror="${fallbackHandler}">` : ""}
                <i class="bi ${s.icon} fallback-icon" aria-hidden="true"></i>
                <div class="card-badges">
                  <span class="badge-sector ${sectorClasses[s.sector] || ""}">${escapeHtml(s.sector)}</span>
                  <span class="badge-sector sector-general badge-deadline ${deadlineInfo.cls}">
                    <i class="bi bi-clock"></i> ${deadlineInfo.text}
                  </span>
                </div>
                <span class="service-icon-tag" aria-hidden="true"><i class="bi ${s.icon}"></i></span>
              </div>
              <div class="service-card-body">
                <h3>${titleHtml}</h3>
                <p>${escapeHtml(s.description)}</p>
                ${renderServiceExamples(s)}
                ${(s.beneficiaries || []).length ? `
                  <div class="service-beneficiaries" aria-label="فئات المستفيدين">
                    <span class="service-beneficiaries-label"><i class="bi bi-people"></i> المستفيدون:</span>
                    ${(s.beneficiaries || []).slice(0, 3).map((b) => `<span class="badge-sector sector-general">${escapeHtml(b)}</span>`).join("")}
                    ${(s.beneficiaries || []).length > 3 ? `<span class="badge-sector sector-general beneficiaries-more" tabindex="0" onclick="event.stopPropagation()">+${(s.beneficiaries || []).length - 3}<span class="beneficiaries-more-tip" role="tooltip">${(s.beneficiaries || []).slice(3).map((b) => `<span>${escapeHtml(b)}</span>`).join("")}</span></span>` : ""}
                  </div>
                ` : ""}
                ${s.referenceUrl ? `
                  <a class="service-ref-link" href="${escapeHtml(s.referenceUrl)}" target="_blank" rel="noopener noreferrer">
                    <i class="bi bi-box-arrow-up-left" aria-hidden="true"></i> المرجع / الصفحة الرسمية
                  </a>
                ` : ""}
                <button type="button" class="btn-naama-primary mt-auto" onclick="startService('${escapeHtml(s.title)}', '${escapeHtml(s.sector)}')">
                  <i class="bi bi-arrow-left"></i> ابدأ الخدمة
                </button>
              </div>
            </article>
          </div>
        </div>
      `;}).join("");

      const moreHtml = shouldLimit ? `
        <div class="col-12 services-more-wrap">
          <button type="button" class="services-more-link" onclick="showMoreHomeServices()">
            المزيد <i class="bi bi-chevron-down" aria-hidden="true"></i>
          </button>
        </div>
      ` : "";

      return cardsHtml + moreHtml;
    }

    /** يبحث عن أي عقدة خدمة/فرعية بالكود داخل الشجرة كاملة. */
    function findPortalNode(code, nodes = PORTAL_SERVICES) {
      for (const node of nodes) {
        if (String(node.code) === String(code) || String(node.id) === String(code)) return node;
        const found = findPortalNode(code, node.children || node.subServices || []);
        if (found) return found;
      }
      return null;
    }

    /** مسار التنقّل من الجذر حتى العقدة (للـ breadcrumb). */
    function findPortalNodePath(code, nodes = PORTAL_SERVICES, trail = []) {
      for (const node of nodes) {
        const next = [...trail, node];
        if (String(node.code) === String(code) || String(node.id) === String(code)) return next;
        const found = findPortalNodePath(code, node.children || node.subServices || [], next);
        if (found) return found;
      }
      return null;
    }

     * هذا يتيح التنقّل في كل مستويات Elwan1 (مثل 7.1 → 7.1.1).
     */
    function openPortalServiceNode(code) {
      const node = findPortalNode(code);
      if (!node) {
        showToast("لم يتم العثور على الخدمة المطلوبة", "bi-exclamation-triangle");
        return;
      }
      if (node.portalPage) {
        openPortalServicePage(node.code || String(node.id));
        return;
      }
      if (node.portalRoute) {
        navigate(node.portalRoute);
        return;
      }
      if (node.externalUrl) {
        openPortalExternalUrl(node.externalUrl);
        return;
      }
      if (node.formType && PORTAL_FORM_ROUTES[node.formType]) {
        openPortalServiceForm(node.code || String(node.id));
        return;
      }
      if (node.pdfUrl) {
        navigate("our-service-pdf", { code: node.code || String(node.id) });
        return;
      }
      if (getPortalChildren(node).length) {
        navigate("our-service-node", { code: node.code || String(node.id) });
        return;
      }
      navigate("our-service-request", { code: node.code || String(node.id) });
    }

        const text = node.definition || "";

          const cut = at + breakAfter.length;
          return `<span class="ps-def-line">${escapeHtml(text.slice(0, cut).trimEnd())}</span><span class="ps-def-line">${escapeHtml(text.slice(cut).trimStart())}</span>`;

      const definitionHtml = node.definition
        ? `<div class="ps-def-block">

        ? `<div class="ps-list-block${node.servicesBoxed ? " ps-list-block--boxed" : ""}">

      const hasPdf = Boolean(node.pdfUrl);
      const hasForm = Boolean(node.formType && PORTAL_FORM_ROUTES[node.formType]);
      const hasExternal = Boolean(node.externalUrl);
      const hasPortalPage = Boolean(node.portalPage);
      const opensRequestCard = opensRequest && !node.hideCta && !hasExternal && !hasPortalPage && !hasForm && !hasPdf;
      const isClickableCard = hasPdf || hasExternal || hasPortalPage || hasForm || opensRequestCard || hasChildrenNav;

            : hasChildrenNav

            : opensRequestCard

      const cardAttrs = isClickableCard
        ? ` role="button" tabindex="0" onclick="${cardClickAction}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${cardClickAction};}"`
        : "";
      const pdfHint = hasPdf && !node.hideCta
        ? `<span class="ps-pdf-hint"><i class="bi bi-file-earmark-pdf" aria-hidden="true"></i> عرض الملف</span>`

    let waterStripEmbedListenerBound = false;
    let waterStripParentToastTimer = null;

    function showWaterStripParentToast(message) {
      let layer = document.getElementById("waterStripParentToast");
      if (!layer) {
        layer = document.createElement("div");
        layer.id = "waterStripParentToast";
        layer.className = "water-strip-parent-toast";
        layer.setAttribute("aria-hidden", "true");
        layer.innerHTML = '<div class="water-strip-parent-toast-box" role="status" aria-live="polite"></div>';
        document.body.appendChild(layer);
      }
      const box = layer.querySelector(".water-strip-parent-toast-box");
      if (box) box.textContent = message;
      layer.classList.add("is-visible");
      layer.setAttribute("aria-hidden", "false");
      if (waterStripParentToastTimer) clearTimeout(waterStripParentToastTimer);
      waterStripParentToastTimer = setTimeout(hideWaterStripParentToast, 3000);
    }

    function hideWaterStripParentToast() {
      const layer = document.getElementById("waterStripParentToast");
      if (!layer) return;
      layer.classList.remove("is-visible");
      layer.setAttribute("aria-hidden", "true");
      if (waterStripParentToastTimer) {
        clearTimeout(waterStripParentToastTimer);
        waterStripParentToastTimer = null;
      }
    }

    function showWaterStripPdfBackBar() {

    function hideWaterStripPdfBackBar() {

      if (bar) bar.hidden = true;
    }

    function restoreWaterStripPageView() {
      const frame = document.getElementById("waterStripEmbed");
      if (!frame) return;
      const headerOffset = 80;
      const top = frame.getBoundingClientRect().top + window.scrollY - headerOffset;
      window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
    }

    function requestWaterStripPdfClose() {
      const iframe = document.getElementById("waterStripEmbed");
      if (iframe && iframe.contentWindow) {
        iframe.contentWindow.postMessage({ type: "water-strip-close-pdf" }, "*");
      }
      hideWaterStripPdfBackBar();
    }

    function initWaterStripEmbed() {
      const applyHeight = (height) => {
        const frame = document.getElementById("waterStripEmbed");
        if (!frame) return;
        const next = Number(height);
        if (!next || Number.isNaN(next)) return;
        frame.style.height = Math.max(520, Math.ceil(next)) + "px";
      };

      if (!waterStripEmbedListenerBound) {
        window.addEventListener("message", (event) => {
          if (!event.data || !event.data.type) return;
          if (event.data.type === "water-strip-embed-back") {
            if (route.name === "our-service-water-strip") {
              navigateBackFromPortalPage(route.params.code);
            }
            return;
          }
          if (event.data.type === "water-strip-show-toast") {
            showWaterStripParentToast(event.data.message || "");
            return;
          }
          if (event.data.type === "water-strip-hide-toast") {
            hideWaterStripParentToast();
            return;
          }
          if (event.data.type === "water-strip-pdf-open") {
            showWaterStripPdfBackBar();
            const frame = document.getElementById("waterStripEmbed");
            if (frame) {
              setTimeout(function () {
                frame.scrollIntoView({ block: "start", behavior: "smooth" });
              }, 80);
            }
            return;
          }
          if (event.data.type === "water-strip-pdf-close") {
            hideWaterStripPdfBackBar();
            return;
          }
          if (event.data.type === "water-strip-restore-page") {
            restoreWaterStripPageView();
            setTimeout(restoreWaterStripPageView, 180);
            setTimeout(restoreWaterStripPageView, 500);
            return;
          }
          if (event.data.type === "driving-embed-height") {
            const frame = document.getElementById("drivingEmbed");
            if (!frame) return;
            const next = Number(event.data.height);
            if (!next || Number.isNaN(next)) return;
            frame.style.height = Math.max(640, Math.ceil(next)) + "px";
            return;
          }
          if (event.data.type === "driving-embed-back") {
            if (route.name === "our-service-driving") {
              navigateBackToOurServices();
            }
            return;
          }
          if (event.data.type === "experimental-embed-height") {
            const frame = document.getElementById("experimentalEmbed");
            if (!frame) return;
            const next = Number(event.data.height);
            if (!next || Number.isNaN(next)) return;
            frame.style.height = Math.max(640, Math.ceil(next)) + "px";
            return;
          }
          if (event.data.type === "experimental-embed-back") {
            if (route.name === "our-service-experimental") {
              navigateBackToOurServices();
            }
            return;
          }
          if (event.data.type === "commercialization-embed-height") {
            const frame = document.getElementById("commercializationEmbed");
            if (!frame) return;
            const next = Number(event.data.height);
            if (!next || Number.isNaN(next)) return;
            frame.style.height = Math.max(720, Math.ceil(next)) + "px";
            return;
          }
          if (event.data.type !== "water-strip-embed-height") return;
          applyHeight(event.data.height);
        });
        waterStripEmbedListenerBound = true;
      }

      const iframe = document.getElementById("waterStripEmbed");
      if (!iframe) return;

      iframe.addEventListener("load", () => {
        try {
          const doc = iframe.contentDocument;
          if (doc) {
            applyHeight(Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight));
          }
        } catch (_) { /* ignore */ }
      });
    }

    const getPortalFieldValue = (id) => (document.getElementById(id)?.value || "").trim();

    const getSelectedPortalChallenges = () =>

    function selectPortalContribution(button) {
      document.querySelectorAll("#portalContribTypes .ps-contrib-option")

    function togglePortalChallenge(button) {
      button.setAttribute("aria-pressed", button.getAttribute("aria-pressed") === "true" ? "false" : "true");
    }

    /** يعيد أول خطأ في الخطوة الحالية، أو null إذا كانت البيانات مكتملة. */
    function findPortalStepError(step) {
      if (step === 2) {
        if (!getPortalFieldValue("portalFullName")) return { id: "portalFullName", message: "يرجى إدخال الاسم الكامل" };
        const email = getPortalFieldValue("portalEmail");
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return { id: "portalEmail", message: "يرجى إدخال بريد إلكتروني صحيح" };
        if (!/^05\d{8}$/.test(getPortalFieldValue("portalPhone"))) {
          return { id: "portalPhone", message: "رقم الجوال يجب أن يبدأ بـ 05 ويكون من ١٠ أرقام" };
        }
        return null;
      }
      if (step === 3) {
        if (!getPortalFieldValue("portalTitle")) return { id: "portalTitle", message: "يرجى إدخال عنوان الفكرة أو البحث" };
        if (!getPortalFieldValue("portalDesc")) return { id: "portalDesc", message: "يرجى كتابة الوصف التفصيلي للمقترح" };
        return null;
      }
      return null;
    }

    /** يعرض أول خطأ حتى الخطوة المحددة وينتقل إليها، ويعيد true إذا وُجد خطأ. */
    function reportPortalStepErrors(untilStep) {
      for (let step = 1; step <= untilStep; step += 1) {
        const error = findPortalStepError(step);
        if (!error) continue;
        showPortalStep(step);
        showToast(error.message, "bi-exclamation-triangle");
        document.getElementById(error.id)?.focus();
        return true;
      }
      return false;
    }

    function goPortalRequestStep(step) {
      /* التحقق من الخطوات السابقة يمنع الوصول للمراجعة ببيانات ناقصة */
      if (reportPortalStepErrors(step - 1)) return;
      if (step === 4) fillPortalRequestReview();
      showPortalStep(step);
    }

    function showPortalStep(step) {
      document.querySelectorAll("#portalRequestRoot .ps-form-step")
        .forEach((panel) => panel.classList.toggle("is-active", panel.dataset.step === String(step)));
      const isSuccess = step === "success";
      document.querySelectorAll("#portalRequestStepper .ps-step-item").forEach((item) => {
        const itemStep = Number(item.dataset.stepNav);
        item.classList.toggle("is-done", isSuccess || itemStep < step);
        item.classList.toggle("is-current", !isSuccess && itemStep === Number(step));
      });
      document.getElementById("portalRequestRoot")?.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function fillPortalRequestReview() {
      const challenges = getSelectedPortalChallenges();
      const entity = getPortalFieldValue("portalEntity");
      const file = document.getElementById("attachment")?.files?.[0];
      const values = {
        portalReviewType: `${getSelectedPortalContribution()} · ${getPortalFieldValue("portalSector")}`,
        portalReviewApplicant: `${getPortalFieldValue("portalFullName")}${entity ? ` — ${entity}` : ""} · ${getPortalFieldValue("portalApplicantType")}`,
        portalReviewTitle: getPortalFieldValue("portalTitle"),
        portalReviewChallenges: challenges.length ? challenges.join(" · ") : "لم يتم ربط الطلب بتحدٍّ محدد",
        portalReviewAttachment: file ? `${file.name} (${formatFileSize(file.size)})` : "لا يوجد مرفق"
      };
      Object.entries(values).forEach(([id, value]) => {
        const el = document.getElementById(id);
        if (el) el.textContent = value;
      });
    }

    function submitPortalRequest() {
      const root = document.getElementById("portalRequestRoot");
      const subService = findPortalNode(root?.dataset.subservice);
      if (!subService) return;

      if (reportPortalStepErrors(PORTAL_REQUEST_STEPS.length)) return;

      const consent = document.getElementById("portalConsent");
      if (!consent || !consent.checked) {
        showToast("يرجى الإقرار بصحة البيانات قبل الإرسال", "bi-exclamation-triangle");
        consent?.focus();
        return;
      }

      const file = document.getElementById("attachment")?.files?.[0];
      const list = getRequests();
      const created = {
        id: nextRequestId(list),
        title: getPortalFieldValue("portalTitle"),
        service: subService.title,
        serviceCode: subService.code,
        sector: getPortalFieldValue("portalSector"),
        summary: getPortalFieldValue("portalDesc"),
        contributionType: getSelectedPortalContribution(),
        challenges: getSelectedPortalChallenges(),
        applicant: getPortalFieldValue("portalFullName"),
        applicantType: getPortalFieldValue("portalApplicantType"),
        organization: getPortalFieldValue("portalEntity") || getPortalFieldValue("portalApplicantType"),
        email: getPortalFieldValue("portalEmail"),
        phone: getPortalFieldValue("portalPhone"),
        attachment: file ? { name: file.name, size: file.size, type: file.type || "file" } : null,
        submittedAt: new Date().toISOString().slice(0, 10),
        status: "قيد المراجعة"
      };
      saveRequests([created, ...list]);

      const ref = document.getElementById("portalRequestRef");
      if (ref) ref.textContent = `رقم الطلب: ${created.id}`;
      showPortalStep("success");
      showToast(`تم استلام الطلب برقم ${created.id}`);
    }

    function formatFileSize(bytes) {
      if (!bytes && bytes !== 0) return "";
      if (bytes < 1024) return `${bytes} بايت`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} ك.ب`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} م.ب`;
    }

    function onAttachmentChange(input) {
      const box = document.getElementById("attachFileInfo");
      const nameEl = document.getElementById("attachFileLabel");
      const metaEl = document.getElementById("attachFileMeta");
      if (!box || !nameEl || !metaEl) return;
      const file = input.files && input.files[0];
      if (!file) {
        box.classList.remove("show");
        nameEl.textContent = "";
        metaEl.textContent = "";
        return;
      }
      const maxBytes = 10 * 1024 * 1024;
      if (file.size > maxBytes) {
        showToast("حجم الملف يتجاوز 10 م.ب", "bi-exclamation-triangle");
        clearAttachment();
        return;
      }
      nameEl.textContent = file.name;
      metaEl.textContent = formatFileSize(file.size);
      box.classList.add("show");
      const attachBox = document.getElementById("attachBox");
      if (attachBox) {
        attachBox.style.borderColor = "";
        attachBox.style.background = "";
      }
    }

    function clearAttachment() {
      const input = document.getElementById("attachment");
      if (input) input.value = "";
      onAttachmentChange({ files: [] });
    }

    function onAttachmentDrop(event) {
      event.preventDefault();
      const box = document.getElementById("attachBox");
      if (box) box.classList.remove("dragover");
      const files = event.dataTransfer && event.dataTransfer.files;
      const input = document.getElementById("attachment");
      if (!files || !files.length || !input) return;
      try {
        const dt = new DataTransfer();
        dt.items.add(files[0]);
        input.files = dt.files;
        onAttachmentChange(input);
      } catch (_) {
        showToast("يرجى اختيار الملف عبر زر اختيار ملف", "bi-paperclip");
      }
    }

          <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb small">
              <li class="breadcrumb-item"><button type="button" class="btn btn-link p-0" onclick="navigate('staff')">لوحة المراجعة</button></li>
              <li class="breadcrumb-item"><button type="button" class="btn btn-link p-0" onclick="navigate('queue')">قائمة الطلبات</button></li>

              <div class="form-panel">

                <div class="mt-3"><h4 class="h6 text-uppercase" style="color:var(--naama-primary)">ملخص الطلب</h4><p class="text-muted">${escapeHtml(request.summary)}</p></div>

                <div class="mt-3"><h4 class="h6 text-uppercase" style="color:var(--naama-primary)">الأثر المتوقع</h4><p class="text-muted">${escapeHtml(request.expectedImpact)}</p></div>
                <hr />
                <div class="row g-3">
                  <div class="col-md-6"><h4 class="h6 text-uppercase" style="color:var(--naama-primary)">مقدّم الطلب</h4><p class="text-muted mb-0">${escapeHtml(request.applicant)}<br />${escapeHtml(request.organization)}</p></div>
                  <div class="col-md-6"><h4 class="h6 text-uppercase" style="color:var(--naama-primary)">التواصل</h4><p class="text-muted mb-0">${escapeHtml(request.email)}<br />${escapeHtml(request.phone)}</p></div>
                </div>
              </div>
            </div>

            <div class="col-lg-5">
              <form class="form-panel" id="reviewForm" data-id="${escapeHtml(request.id)}">
                <h2 class="section-title" style="font-size:1.2rem">بطاقة التقييم</h2>
                <p class="text-muted small">قيّم كل معيار من 1 (ضعيف) إلى 5 (ممتاز).</p>
                <div class="d-flex flex-column gap-3">
                  ${criteriaGuide.map((c) => `
                    <div class="score-box">
                      <label for="${c.key}">${c.title} — <span id="${c.key}Val">${scores[c.key]}</span> / 5</label>
                      <p class="text-muted small mb-2">${c.description}</p>
                      <input id="${c.key}" name="${c.key}" type="range" min="1" max="5" step="1" value="${scores[c.key]}" />

                  <div><div class="stat-value" id="avgScore">${averageScore(scores)}</div><div class="stat-label">متوسط التقييم الحالي</div></div>

                <div class="mt-3">

    /* ============ Event bindings ============ */
    function bindPageEvents() {
      const search = document.getElementById("serviceSearch");
      if (search) {
        search.addEventListener("input", (e) => {
          searchTerm = e.target.value;
          homeServicesShowAll = false;
          refreshServiceGrid();
          syncFilterUIs(e.target);
        });
      }

      filterRegistry.forEach((f) => {
        const el = document.getElementById(f.id);
        if (el) {
          el.addEventListener("change", (e) => {
            f.setValue(e.target.value);
            homeServicesShowAll = false;
            refreshServiceGrid();
            syncFilterUIs(e.target);
          });
        }
      });

      const submitForm = document.getElementById("submitForm");
      if (submitForm) {
        submitForm.addEventListener("submit", (event) => {
          event.preventDefault();
          const isNibras = submitForm.dataset.formType === "nibras";
          const isIpRegistration = submitForm.dataset.formType === "ip-registration";
          const isIpConsulting = submitForm.dataset.formType === "ip-consulting";
          const isIpTraining = submitForm.dataset.formType === "ip-training";
          const data = Object.fromEntries(new FormData(submitForm).entries());
          let attachment = null;

          if (isIpConsulting) {
            const requiredFields = [
              { key: "consultDate", label: "التاريخ", id: "consultDate" },
              { key: "consultRef", label: "الرقم", id: "consultRef" },
              { key: "consultSubject", label: "الموضوع", id: "consultSubject" }
            ];
            for (const field of requiredFields) {
              if (!(data[field.key] || "").trim()) {
                showToast(`يرجى إدخال ${field.label}`, "bi-exclamation-triangle");
                const el = document.getElementById(field.id);
                if (el) el.focus();
                return;
              }
            }
            const sectionsFilled = IP_CONSULTING_SECTIONS.some((section) => (data[section.name] || "").trim());
            if (!sectionsFilled) {
              showToast("يرجى تعبئة أحد أقسام الاستشارة على الأقل", "bi-exclamation-triangle");
              return;
            }
            data.applicant = data.consultSubject;
            data.title = `استشارة ملكية فكرية — ${data.consultSubject}`;
            data.summary = IP_CONSULTING_SECTIONS
              .filter((section) => (data[section.name] || "").trim())
              .map((section) => `${section.title}: ${(data[section.name] || "").trim().slice(0, 80)}`)
              .join(" | ");
          } else if (isIpRegistration) {
            if (!(data.orgUnit || "").trim()) {
              showToast("يرجى إدخال اسم الوحدة التنظيمية طالبة التسجيل", "bi-exclamation-triangle");
              const orgUnit = document.getElementById("orgUnit");
              if (orgUnit) orgUnit.focus();
              return;
            }
            const topics = [];
            for (let i = 1; i <= 4; i += 1) {
              const name = (data[`topicName_${i}`] || "").trim();
              const type = (data[`topicType_${i}`] || "").trim();
              const description = (data[`topicDesc_${i}`] || "").trim();
              if (name || type || description) {
                topics.push({ name, type, description });
              }
            }
            if (!topics.length) {
              showToast("يرجى إدخال موضوع حماية واحد على الأقل", "bi-exclamation-triangle");
              return;
            }
            const filesInput = document.getElementById("ipAttachments");
            const files = filesInput && filesInput.files ? Array.from(filesInput.files) : [];
            if (!files.length) {
              showToast("يرجى إرفاق المستندات المتعلقة بموضوع الحماية", "bi-exclamation-triangle");
              if (filesInput) filesInput.focus();
              return;
            }
            data.topics = topics;
            data.applicant = data.orgUnit;
            data.title = `طلب تسجيل ملكية فكرية — ${data.orgUnit}`;
            data.summary = topics.map((topic, index) => `${index + 1}. ${topic.name || "—"} (${topic.type || "—"})`).join(" | ");
            for (let i = 1; i <= 4; i += 1) {
              delete data[`topicName_${i}`];
              delete data[`topicType_${i}`];
              delete data[`topicDesc_${i}`];
            }
            delete data.ipAttachments;
            attachment = files.map((file) => ({
              name: file.name,
              size: file.size,
              type: file.type || "file"
            }));
          } else if (isIpTraining) {
            const requiredFields = [
              { key: "courseName", label: "اسم الدورة", id: "courseName" },
              { key: "traineeName", label: "اسم المتدرب", id: "traineeName" },
              { key: "traineeId", label: "رقم الهوية", id: "traineeId" },
              { key: "traineeEmail", label: "البريد الإلكتروني", id: "traineeEmail" },
              { key: "traineeMobile", label: "رقم الجوال", id: "traineeMobile" },
              { key: "traineeOrg", label: "الجهة", id: "traineeOrg" }
            ];
            for (const field of requiredFields) {
              if (!(data[field.key] || "").trim()) {
                showToast(`يرجى إدخال ${field.label}`, "bi-exclamation-triangle");
                const el = document.getElementById(field.id);
                if (el) el.focus();
                return;
              }
            }

            const courseName = String(data.courseName || "").trim();
            if (!courseName) {
              showToast("يرجى إدخال اسم الدورة", "bi-exclamation-triangle");
              const el = document.getElementById("courseName");
              if (el) el.focus();
              return;
            }

            const traineeId = String(data.traineeId || "").replace(/\s+/g, "");
            if (!/^1\d*$/.test(traineeId)) {
              showToast("رقم الهوية يجب أن يبدأ بالرقم 1", "bi-exclamation-triangle");
              const el = document.getElementById("traineeId");
              if (el) el.focus();
              return;
            }

            const traineeEmail = String(data.traineeEmail || "").trim();
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(traineeEmail)) {
              showToast("يرجى إدخال بريد إلكتروني بصيغة صحيحة", "bi-exclamation-triangle");
              const el = document.getElementById("traineeEmail");
              if (el) el.focus();
              return;
            }

            const traineeMobile = String(data.traineeMobile || "").replace(/[\s\-]/g, "");
            if (!/^05\d{8}$/.test(traineeMobile)) {
              showToast("رقم الجوال يجب أن يبدأ بـ 05 ويتكون من 10 أرقام", "bi-exclamation-triangle");
              const el = document.getElementById("traineeMobile");
              if (el) el.focus();
              return;
            }

            data.courseName = courseName;
            data.traineeId = traineeId;
            data.traineeEmail = traineeEmail;
            data.traineeMobile = traineeMobile;
            data.applicant = data.traineeName;
            data.title = `تسجيل دورة تدريبية — ${data.courseName}`;
            data.summary = `${data.traineeName} | ${data.traineeOrg} | ${data.traineeEmail} | ${data.traineeMobile}`;
            data.sector = data.sector || "الملكية الفكرية";
            data.service = data.serviceTitle || "التدريب بمجال الملكية الفكرية";
          } else if (isNibras) {
            const consentOk = ["consentDataUse", "consentRules", "consentAttendance"].every((id) => {
              const el = document.getElementById(id);
              return el && el.checked;
            });
            if (!consentOk) {
              showToast("يرجى الموافقة على جميع بنود الموافقة والاتفاقية", "bi-exclamation-triangle");
              return;
            }
            const fullName = [data.firstName, data.lastName].filter(Boolean).join(" ").trim();
            data.applicant = fullName || data.applicant || "مقدم طلب نبراس";
            data.title = (data.ideaBrief || "").trim().slice(0, 120) || `طلب منصة نبراس — ${data.applicant}`;
            data.summary = data.ideaBrief || data.techPathElement || "";
            data.expectedImpact = data.expectedMarketImpact || data.techPathElement || "";
            data.methodology = data.scalabilityPotential || data.innovationUniqueness || "";
            delete data.attachment;
            delete data.projectPitchFile;
            delete data.illustrationsFiles;
            delete data.additionalDocsFiles;
            const pitch = document.getElementById("projectPitchFile");
            const illustrations = document.getElementById("illustrationsFiles");
            const additionalDocs = document.getElementById("additionalDocsFiles");
            const file = (pitch && pitch.files && pitch.files[0])
              || (illustrations && illustrations.files && illustrations.files[0])
              || (additionalDocs && additionalDocs.files && additionalDocs.files[0])
              || null;
            if (file) {
              attachment = { name: file.name, size: file.size, type: file.type || "file" };
            }
          } else {
            const fileInput = document.getElementById("attachment");
            const file = fileInput && fileInput.files && fileInput.files[0];
            const attachBox = document.getElementById("attachBox");
            if (!file) {
              if (attachBox) {
                attachBox.style.borderColor = "#c0392b";
                attachBox.style.background = "#fdecec";
              }
              showToast("مرفق الطلب ضروري، يرجى اختيار ملف", "bi-exclamation-triangle");
              if (fileInput) fileInput.focus();
              return;
            }
            if (attachBox) {
              attachBox.style.borderColor = "";
              attachBox.style.background = "";
            }
            delete data.attachment;
            attachment = {
              name: file.name,
              size: file.size,
              type: file.type || "file"
            };
          }

          const list = getRequests();
          const created = {
            ...data,
            attachment,
            id: nextRequestId(list),
            submittedAt: new Date().toISOString().slice(0, 10),
            status: "قيد المراجعة"
          };
          saveRequests([created, ...list]);
          showToast(`تم استلام الطلب برقم ${created.id}`);
          setTimeout(() => navigate("my-requests"), 800);
        });
      }

      const filter = document.getElementById("status-filter");
      if (filter) filter.addEventListener("change", () => navigate("queue", { filter: filter.value }));

      const reviewForm = document.getElementById("reviewForm");
      if (reviewForm) {
        ["relevance", "feasibility", "impact"].forEach((key) => {
          const input = document.getElementById(key);
          const val = document.getElementById(key + "Val");
          input.addEventListener("input", () => {
            val.textContent = input.value;
            const scores = {
              relevance: Number(document.getElementById("relevance").value),
              feasibility: Number(document.getElementById("feasibility").value),
              impact: Number(document.getElementById("impact").value)
            };
            document.getElementById("avgScore").textContent = averageScore(scores);
          });
        });
        reviewForm.addEventListener("submit", (event) => {
          event.preventDefault();
          const id = reviewForm.dataset.id;
          const list = getRequests();
          const index = list.findIndex((r) => r.id === id);
          if (index < 0) return;
          list[index] = {
            ...list[index],
            scores: {
              relevance: Number(document.getElementById("relevance").value),
              feasibility: Number(document.getElementById("feasibility").value),
              impact: Number(document.getElementById("impact").value)
            },
            status: document.getElementById("decision").value,
            reviewNotes: document.getElementById("notes").value
          };
          saveRequests(list);
          showToast("تم حفظ نتيجة المراجعة");
          setTimeout(() => navigate("queue"), 800);
        });
      }
    }

    /* ============ Category / search helpers ============ */
    function expandHomeServices() {
      const panel = document.getElementById("servicesExpandPanel");
      if (!panel) return;
      homeServicesExpanded = true;
      panel.classList.add("is-expanded");
      panel.setAttribute("aria-hidden", "false");
      const hint = document.getElementById("servicesExpandHint");
      if (hint) hint.remove();
      const collapseWrap = document.getElementById("servicesCollapseWrap");
      if (collapseWrap) collapseWrap.classList.add("is-visible");
    }

    function collapseHomeServices() {
      const panel = document.getElementById("servicesExpandPanel");
      if (!panel) return;

      homeServicesExpanded = false;
      homeServicesShowAll = false;
      panel.classList.remove("is-expanded");
      panel.setAttribute("aria-hidden", "true");

      const collapseWrap = document.getElementById("servicesCollapseWrap");
      if (collapseWrap) collapseWrap.classList.remove("is-visible");

      document.querySelectorAll("#categoryChips .chip").forEach((el) => {
        el.classList.remove("active");
        el.setAttribute("aria-selected", "false");
      });

      const grid = document.getElementById("serviceGrid");
      if (grid) {
        // Clear after collapse animation so content doesn't flash
        window.setTimeout(() => {
          if (!homeServicesExpanded && grid) grid.innerHTML = "";
        }, 450);
      }

      const chips = document.getElementById("categoryChips");
      if (chips && !document.getElementById("servicesExpandHint")) {
        const hint = document.createElement("p");
        hint.className = "services-expand-hint";
        hint.id = "servicesExpandHint";
        hint.textContent = "اضغط على أي برنامج لإظهار الخدمات.";
        const collapseEl = document.getElementById("servicesCollapseWrap");
        if (collapseEl && collapseEl.parentNode) {
          collapseEl.insertAdjacentElement("afterend", hint);
        } else {
          chips.insertAdjacentElement("afterend", hint);
        }
      }
    }

    function setCategory(cat) {
      categoryFilter = cat;
      homeServicesShowAll = false;
      document.querySelectorAll("#categoryChips .chip, .chip[data-cat]").forEach((el) => {
        const active = el.dataset.cat === cat;
        el.classList.toggle("active", active);
        if (el.hasAttribute("aria-selected")) {
          el.setAttribute("aria-selected", active ? "true" : "false");
        }
      });
      expandHomeServices();
      refreshServiceGrid();
    }
    function focusSearch() {
      const el = document.getElementById("serviceSearch");
      if (el) el.focus();
    }

    function resetFilters() {
      searchTerm = "";
      categoryFilter = "";
      homeServicesShowAll = false;
      filterRegistry.forEach((f) => f.setValue(f.defaultValue));

      const searchEl = document.getElementById("serviceSearch");
      if (searchEl) searchEl.value = "";

      filterRegistry.forEach((f) => {
        const el = document.getElementById(f.id);
        if (el) el.value = f.defaultValue;
      });

      document.querySelectorAll(".chip").forEach((el) => {
        el.classList.toggle("active", false);
      });

      refreshServiceGrid();
      showToast("تم إعادة تعيين الفلاتر", "bi-arrow-counterclockwise");
    }

    /* ============ Request details modal ============ */
    function openRequestDetails(id) {
      const request = getRequests().find((r) => r.id === id);
      if (!request) return;
      const body = document.getElementById("requestModalBody");
      const avg = averageScore(request.scores);
      body.innerHTML = `
        <div class="d-flex flex-wrap gap-2 mb-3">
          <span class="badge-sector ${sectorClasses[request.sector] || ""}">${escapeHtml(request.sector)}</span>
          <span class="badge-sector sector-general">${escapeHtml(request.service || "")}</span>
          <span class="${statusClass(request.status)}">${escapeHtml(request.status)}</span>
        </div>
        <h4 style="color:var(--naama-primary);font-weight:700">${escapeHtml(request.title)}</h4>
        <div class="row g-3 mt-2 small">
          <div class="col-6"><strong>رقم الطلب:</strong> ${escapeHtml(request.id)}</div>
          <div class="col-6"><strong>تاريخ الإنشاء:</strong> ${escapeHtml(request.submittedAt)}</div>
          <div class="col-6"><strong>مقدّم الطلب:</strong> ${escapeHtml(request.applicant)}</div>
          <div class="col-6"><strong>الجهة:</strong> ${escapeHtml(request.organization)}</div>
          <div class="col-6"><strong>البريد:</strong> ${escapeHtml(request.email)}</div>
          <div class="col-6"><strong>الجوال:</strong> ${escapeHtml(request.phone)}</div>
          ${request.attachment ? `
            <div class="col-12"><strong>المرفق:</strong>
              <p class="text-muted mb-0 mt-1">
                <i class="bi bi-paperclip"></i>
                ${escapeHtml(request.attachment.name || "")}
                ${request.attachment.size ? `<span class="ms-1">(${formatFileSize(request.attachment.size)})</span>` : ""}
              </p>
            </div>
          ` : ""}
          ${request.contributionType ? `<div class="col-6"><strong>نوع المساهمة:</strong> ${escapeHtml(request.contributionType)}</div>` : ""}
          ${(request.challenges || []).length ? `<div class="col-12"><strong>التحديات المرتبطة:</strong> ${escapeHtml((request.challenges || []).join(" · "))}</div>` : ""}
          <div class="col-12"><strong>الملخص:</strong><p class="text-muted mb-0 mt-1">${escapeHtml(request.summary)}</p></div>
          ${request.methodology ? `<div class="col-12"><strong>المنهجية:</strong><p class="text-muted mb-0 mt-1">${escapeHtml(request.methodology)}</p></div>` : ""}
          ${request.expectedImpact ? `<div class="col-12"><strong>الأثر المتوقع:</strong><p class="text-muted mb-0 mt-1">${escapeHtml(request.expectedImpact)}</p></div>` : ""}
          ${avg !== null ? `<div class="col-12"><strong>متوسط التقييم:</strong> ${avg} / 5</div>` : ""}
          ${request.reviewNotes ? `<div class="col-12"><strong>ملاحظات المراجعة:</strong><p class="text-muted mb-0 mt-1">${escapeHtml(request.reviewNotes)}</p></div>` : ""}
        </div>
      `;
      const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById("requestModal"));
      modal.show();
    }

    /* ============ Render orchestration ============ */
    function render() {
      const isLogin = route.name === "login";
      document.body.classList.toggle("login-mode", isLogin);
      renderHeader();
      renderHeaderSearch();
      const app = document.getElementById("app");
      const views = {
        home: viewHome,
        "our-services": viewOurServices,
        "our-service": viewPortalServiceDetail,
        "our-service-node": viewPortalServiceNode,
        "our-service-request": viewPortalSubServiceRequest,
        "our-service-pdf": viewPortalServicePdf,
        "our-service-ip-form": viewPortalIpRegistrationForm,
        "our-service-ip-consulting-form": viewPortalIpConsultingForm,
        "our-service-water-strip": viewPortalWaterStrip,
        "our-service-driving": viewPortalDriving,
        "our-service-experimental": viewPortalExperimental,
        services: viewServices,
        login: viewLogin,
        submit: viewSubmit,
        "my-requests": viewMyRequests,
        news: viewNews,
        "news-detail": viewNewsDetail,
        publications: viewPublications,
        "publication-detail": viewPublicationDetail,
        "agency-report": viewAgencyReportTopic,
        staff: viewStaff,
        queue: viewQueue,
        criteria: viewCriteria,
        review: viewReview
      };
      app.innerHTML = (views[route.name] || viewHome)();
      bindPageEvents();
      bindAgencyReportsGrid();
      initWaterStripEmbed();
      initDrivingEmbed();
      initExperimentalEmbed();
      initCommercializationEmbed();
      if (bannerTimer) { clearInterval(bannerTimer); bannerTimer = null; }
      if (document.getElementById("heroBanner")) initBanner();
      if (document.querySelector(".achievement-value")) initAchievementCounters();
      if (document.querySelector(".service-card-shell")) syncServiceCardRings();
      if (document.querySelector(".focus-areas-panel")) {
        requestAnimationFrame(() => {
          syncFocusAreaRails();
          document.querySelectorAll(".focus-area-card-media img").forEach((img) => {
            if (!img.complete) img.addEventListener("load", syncFocusAreaRails, { once: true });
          });
        });
      }
      if (isLogin) {
        const idEl = document.getElementById("naamaLoginId");
        if (idEl) setTimeout(() => idEl.focus(), 50);
      }
    }

    /* ============ Init ============ */
    (function initAppFromUrl() {
      const parsed = parseRouteFromUrl();
      navigate(parsed ? parsed.name : "home", parsed ? parsed.params : {});
    })();

    window.addEventListener("resize", () => {
      if (document.querySelector(".focus-areas-panel")) syncFocusAreaRails();
    });

    window.addEventListener("popstate", (event) => {
      const parsed = event.state?.route || parseRouteFromUrl();
      if (parsed) {
        route = { name: parsed.name, params: parsed.params || {} };
        render();
        return;
      }
      route = { name: "home", params: {} };
      render();
    });
  </script>
</body>
</html>
